[flake8]
exclude =
    .git
    .github
    __pycache__
    .venv/
    VK_Overflow/*/migrations/*
show-source = True
statistics = True
count = True
max-line-length = 99
import-order-style = pep8
literal-inline-quotes = single
literal-multiline-quotes = single
literal-docstring-quotes = single
verbose = 1
application-import-names = questions, users, core
ignore = AZ100  # resolves flake8-alphabetize and flake8-import-order
