{% load static %}
{# We will use middleware or context processors and for loop, that's wiil be best solution #}
<div class="container p-3" style="border-radius: 1em; border: solid darkgray 1px">
    <p class="fs-4">Популярные теги</p>
    <div class="d-flex flex-wrap col-12 gap-1 p-1 justify-content-start">
        {% for tag in popular_tags %}
            <span class="badge bg-primary-subtle text-primary-emphasis rounded-pill">
                <a style="text-decoration: none; color: inherit" href="{% url 'view_tag' tag=tag %}">
                    {{ tag }}
                </a>
            </span>
        {% endfor %}
    </div>
</div>

<div class="container p-3" style="border-radius: 1em; border: solid darkgray 1px; margin-top: 1rem;">
    <p class="fs-4">Активные пользователи</p>
    <div class="d-flex flex-column col-12 gap-1 p-1 justify-content-start fs-6">
        <a style="color: orangered">Hindu</a>
        <a style="color: darkslategray">Mr. Freeman</a>
        <a style="color: darkslategray">Code master</a>
        <a style="color: dimgrey">Linus Torvalds</a>
        <a style="color: dimgrey">Just a moder</a>
    </div>
</div>
