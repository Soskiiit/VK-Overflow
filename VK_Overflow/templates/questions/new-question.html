{% extends 'core/base.html' %}
{% load static %}

{% block tab_title %}
    Задать вопрос
{% endblock tab_title %}

{% block content %}
    <form method="POST">
        <div class="container p-5 border border-dark-subtle rounded-4">
            <p class="fs-4 mb-4">Задать вопрос</p>
            <label for="title">Заголовок</label>
            {{ form.title }}

            <label class="mt-3" for="description">Описание вопроса</label>
            {{ form.question_text }}

            <label class="mt-3" for="tags">Теги</label>
            {{ form.tags }}

            {% csrf_token %}
            <button type="submit" class="btn btn-primary mt-5">Создать вопрос</button>
        </div>
    </form>
{% endblock content %}
