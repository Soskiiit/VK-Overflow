{% extends 'core/base.html' %}
{% load static %}

{% block tab_title %}
    Мой профиль
{% endblock tab_title %}

{% block content %}
    <div class="container p-5 border border-dark-subtle rounded-4">
        <p class="fs-4 mb-4">Задать вопрос</p>

        <label for="title">Заголовок</label>
        <input type="text" class="form-control mt-1" id="title" placeholder="Заголовок вашего вопроса">

        <label class="mt-3" for="description">Описание вопроса</label>
        <textarea class="form-control mt-1" id="description" rows="3" placeholder="Подробно опишите свой вопрос"></textarea>


        <label class="mt-3" for="tags">Теги</label>
        <input type="text" class="form-control mt-1" id="tags" placeholder="Введите теги через пробел">

        <btn class="btn btn-primary mt-5">Создать вопрос</btn>
    </div>
{% endblock content %}
