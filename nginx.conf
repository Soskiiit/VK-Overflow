events {
    worker_connections 1024;
}

http {
    default_type  text/plain;
    sendfile        on;
    keepalive_timeout  65;

    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;

    server {
        listen 8088;
        server_name localhost;

        location /static/ {
            alias /home/archi/PycharmProjects/test/static/;
        }

        location /proxy/dynamic {
            proxy_pass http://127.0.0.1:8320/dynamic;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /cached/dynamic {
            proxy_pass http://127.0.0.1:8320/dynamic;
            proxy_cache my_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
