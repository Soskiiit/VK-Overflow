user archi;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        server 127.0.0.1:8000;
        # server bla-bla.bla;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=vk_overflow:10m max_size=1g
                     inactive=10m use_temp_path=off;

    server {
        listen 8081;
        server_name localhost;

        access_log /home/archi/PycharmProjects/VK-Overflow/nginx_access.log;
        error_log /home/archi/PycharmProjects/VK-Overflow/nginx_error.log;

        location /static/ {
            alias /home/archi/PycharmProjects/VK-Overflow/VK_Overflow/static/;
        }

        location /media/ {
            alias /home/archi/PycharmProjects/VK-Overflow/VK_Overflow/media/;
        }

        location /hot/ {
            proxy_pass http://backend_servers;
            proxy_cache vk_overflow;
            proxy_cache_valid 200 302 10m;

            add_header X-Proxy-Cache $upstream_cache_status;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
