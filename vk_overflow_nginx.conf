user archi;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8081;
        server_name localhost;

        access_log /home/archi/PycharmProjects/VK-Overflow/nginx_access.log;
        error_log /home/archi/PycharmProjects/VK-Overflow/nginx_error.log;

        location /static/ {
            alias /home/archi/PycharmProjects/VK-Overflow/VK_Overflow/static/;
        }

        location /media/ {
            alias /home/archi/PycharmProjects/VK-Overflow/VK_Overflow/media/;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
